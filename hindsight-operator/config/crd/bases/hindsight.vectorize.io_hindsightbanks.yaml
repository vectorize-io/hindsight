---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: hindsightbanks.hindsight.vectorize.io
spec:
  group: hindsight.vectorize.io
  names:
    kind: HindsightBank
    listKind: HindsightBankList
    plural: hindsightbanks
    shortNames:
    - hsbank
    singular: hindsightbank
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.bankId
      name: Bank
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HindsightBank declares the configuration, summary definitions
          (mental models), and directives of one Hindsight memory bank.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HindsightBankSpec defines the desired state of a Hindsight
              bank.
            properties:
              bankId:
                description: BankID is the Hindsight bank to manage. Defaults to metadata.name.
                minLength: 1
                type: string
              connection:
                description: Connection to the Hindsight API.
                properties:
                  apiKeySecretRef:
                    description: |-
                      APIKeySecretRef selects the API key sent as a bearer token. Omit it when
                      the API does not require authentication.
                    properties:
                      key:
                        description: Key within the Secret that holds the value.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  url:
                    description: |-
                      URL is the base URL of the Hindsight API, for example
                      http://hindsight-api.hindsight.svc.cluster.local:8888.
                    pattern: ^https?://
                    type: string
                required:
                - url
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy controls whether deleting this resource deletes the
                  bank. Delete only removes a bank that this resource created, so
                  adopting an existing bank never puts its memories at risk.
                enum:
                - Retain
                - Delete
                type: string
              template:
                description: |-
                  Template is a Hindsight bank template manifest, in the same format that
                  GET /v1/default/banks/{bank_id}/export returns and
                  POST /v1/default/banks/{bank_id}/import accepts. The Hindsight API
                  validates it, so the operator does not depend on a particular server
                  version's field list.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - connection
            - template
            type: object
            x-kubernetes-validations:
            - message: bankId is immutable
              rule: has(self.bankId) == has(oldSelf.bankId) && (!has(self.bankId)
                || self.bankId == oldSelf.bankId)
          status:
            description: HindsightBankStatus is the observed state of a HindsightBank.
            properties:
              bankCreated:
                description: |-
                  BankCreated is true when this resource created the bank. Only such
                  banks are deleted under DeletionPolicy Delete.
                type: boolean
              conditions:
                description: |-
                  Conditions describe the current state. The Ready condition is True when
                  the bank matches the template.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              createdOnURL:
                description: |-
                  CreatedOnURL is the connection URL of the server where this resource
                  created the bank. Delete removes the bank only while spec.connection.url
                  still points at that server, so moving the resource to another server
                  never deletes a bank there.
                type: string
              lastAppliedChanges:
                description: |-
                  LastAppliedChanges lists what the last import changed, for example
                  "bank.retain_mission" or "mental_models/preferences".
                items:
                  type: string
                type: array
              lastAppliedTime:
                description: LastAppliedTime is when the operator last imported a
                  change.
                format: date-time
                type: string
              notConvergedGeneration:
                description: |-
                  NotConvergedGeneration is the generation whose import did not converge.
                  The operator does not import again until the spec changes.
                format: int64
                type: integer
              observedGeneration:
                description: ObservedGeneration is the most recent generation the
                  operator acted on.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
