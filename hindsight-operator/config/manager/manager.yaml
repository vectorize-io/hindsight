apiVersion: v1
kind: Namespace
metadata:
  name: hindsight-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hindsight-operator
  namespace: hindsight-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight-operator
  namespace: hindsight-operator
  labels:
    app.kubernetes.io/name: hindsight-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight-operator
    spec:
      serviceAccountName: hindsight-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/vectorize-io/hindsight-operator:0.10.1
          args:
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
