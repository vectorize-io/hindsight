<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310"><rect width="880" height="310" rx="20" fill="#ffffff"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="49" font-size="30" fill="#18181b" font-weight="700">What went wrong with agent memory</text><rect x="28" y="82" width="268" height="190" rx="14" fill="#f4f4f5" stroke="#0074d9" stroke-width="2"/><text x="43" y="125" font-size="19" fill="#52525b" font-weight="700">u/gptrv</text><text x="43" y="181" font-size="16" fill="#18181b" font-weight="400">“It grew past what the</text><text x="43" y="210" font-size="16" fill="#18181b" font-weight="400">agent reliably read”</text><rect x="306" y="82" width="268" height="190" rx="14" fill="#f4f4f5" stroke="#009296" stroke-width="2"/><text x="321" y="125" font-size="19" fill="#52525b" font-weight="700">u/manojbadam</text><text x="321" y="181" font-size="16" fill="#18181b" font-weight="400">“new learnings overrides</text><text x="321" y="210" font-size="16" fill="#18181b" font-weight="400">the old memory”</text><rect x="584" y="82" width="268" height="190" rx="14" fill="#f4f4f5" stroke="#0074d9" stroke-width="2"/><text x="599" y="125" font-size="19" fill="#52525b" font-weight="700">u/Sun77177</text><text x="599" y="181" font-size="16" fill="#18181b" font-weight="400">“rewriting its own summaries</text><text x="599" y="210" font-size="16" fill="#18181b" font-weight="400">until the detail was gone”</text></g></svg>