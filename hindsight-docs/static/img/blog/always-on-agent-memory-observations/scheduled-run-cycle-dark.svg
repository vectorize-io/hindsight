<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410"><rect width="880" height="410" rx="20" fill="#18181b"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="48" font-size="30" fill="#e4e4e7" font-weight="700">Memory during a scheduled run</text><rect x="28" y="80" width="250" height="117" rx="14" fill="#27272a" stroke="#0074d9" stroke-width="2"/><text x="43" y="112" font-size="20" fill="#e4e4e7" font-weight="700">Reads its memory</text><text x="43" y="145" font-size="16" fill="#a1a1aa" font-weight="400">Recall for the event</text><text x="43" y="170" font-size="16" fill="#a1a1aa" font-weight="400">Read a mental model if set</text><rect x="311" y="80" width="250" height="117" rx="14" fill="#27272a" stroke="#0074d9" stroke-width="2"/><text x="326" y="112" font-size="20" fill="#e4e4e7" font-weight="700">Works</text><text x="326" y="145" font-size="16" fill="#a1a1aa" font-weight="400">Agent handles the event</text><rect x="594" y="80" width="250" height="117" rx="14" fill="#27272a" stroke="#0074d9" stroke-width="2"/><text x="609" y="112" font-size="20" fill="#e4e4e7" font-weight="700">Updates its memory</text><text x="609" y="145" font-size="16" fill="#a1a1aa" font-weight="400">Retain the run record</text><path d="M282 136H305m-7-7 7 7-7 7 M565 136H588m-7-7 7 7-7 7" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M720 197V258m-8-8 8 8 8-8" stroke="#009296" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="310" y="260" width="535" height="112" rx="14" fill="#27272a" stroke="#009296" stroke-width="2"/><text x="330" y="304" font-size="23" fill="#e4e4e7" font-weight="700">Consolidate facts into observations</text><text x="330" y="339" font-size="17" fill="#a1a1aa" font-weight="400">Runs in the background and can lag behind retain.</text></g></svg>