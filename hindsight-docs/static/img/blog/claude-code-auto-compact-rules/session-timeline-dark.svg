<svg xmlns="http://www.w3.org/2000/svg" width="800" height="610" viewBox="0 0 800 610" font-family="Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#a1a1aa"/>
</marker>
</defs>
<rect x="0" y="0" width="800" height="610" fill="#18181b" stroke="none" rx="18"/>
<text x="35" y="47" fill="#e4e4e7" font-size="30" font-weight="700">One session through auto compact</text>
<rect x="35" y="70" width="520" height="505" fill="#18181b" stroke="#a1a1aa" rx="12"/>
<text x="57" y="105" fill="#a1a1aa" font-size="20" font-weight="700">Claude Code context window</text>
