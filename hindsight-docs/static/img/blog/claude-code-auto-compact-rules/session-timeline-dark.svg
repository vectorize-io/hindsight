<rect x="71" y="138" width="5" height="46" fill="#0074d9" stroke="none" rx="2"/>
<text x="87" y="158" fill="#e4e4e7" font-size="22" font-weight="700">Conversation</text>
<text x="87" y="186" fill="#a1a1aa" font-size="18" font-weight="400">You set rules for the repository.</text>
<path d="M294 198v12" fill="none" stroke="#a1a1aa" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="57" y="212" width="475" height="74" fill="#27272a" stroke="#0074d9" rx="12"/>
<rect x="71" y="226" width="5" height="46" fill="#0074d9" stroke="none" rx="2"/>
<text x="87" y="246" fill="#e4e4e7" font-size="22" font-weight="700">Auto compact</text>
<text x="87" y="274" fill="#a1a1aa" font-size="18" font-weight="400">Claude Code summarizes the conversation.</text>
<path d="M294 286v12" fill="none" stroke="#a1a1aa" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="57" y="300" width="475" height="74" fill="#27272a" stroke="#0074d9" rx="12"/>
<rect x="71" y="314" width="5" height="46" fill="#0074d9" stroke="none" rx="2"/>
<text x="87" y="334" fill="#e4e4e7" font-size="22" font-weight="700">SessionStart (source: compact)</text>
<text x="87" y="362" fill="#a1a1aa" font-size="18" font-weight="400">The Hindsight hook runs.</text>
<path d="M294 374v12" fill="none" stroke="#a1a1aa" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="57" y="388" width="475" height="74" fill="#27272a" stroke="#0074d9" rx="12"/>
<rect x="71" y="402" width="5" height="46" fill="#0074d9" stroke="none" rx="2"/>
<text x="87" y="422" fill="#e4e4e7" font-size="22" font-weight="700">Hindsight block returns</text>
<text x="87" y="450" fill="#a1a1aa" font-size="16" font-weight="400">Tool guide, and page count or &quot;No pages yet&quot;.</text>
<path d="M294 462v12" fill="none" stroke="#a1a1aa" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="57" y="476" width="475" height="74" fill="#27272a" stroke="#009296" rx="12"/>
<rect x="71" y="490" width="5" height="46" fill="#009296" stroke="none" rx="2"/>
<text x="87" y="510" fill="#e4e4e7" font-size="22" font-weight="700">Stop</text>
<text x="87" y="538" fill="#a1a1aa" font-size="16" font-weight="400">By default, the hook writes session turns to the bank.</text>
<path d="M533 513H570" fill="none" stroke="#a1a1aa" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="575" y="461" width="200" height="107" fill="#27272a" stroke="#009296" rx="12"/>
<rect x="589" y="475" width="5" height="79" fill="#009296" stroke="none" rx="2"/>
<text x="605" y="495" fill="#e4e4e7" font-size="18" font-weight="700">Repo memory</text>
<text x="605" y="523" fill="#a1a1aa" font-size="18" font-weight="400">One bank outside</text>
<text x="605" y="546" fill="#a1a1aa" font-size="15" font-weight="400">the context window</text>
