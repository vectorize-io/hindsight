<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1814" viewBox="0 0 800 1814" font-family="Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#52525b"/>
</marker>
</defs>
<rect x="0" y="0" width="800" height="1814" fill="#ffffff" stroke="none" rx="18"/>
<text x="30" y="52" fill="#18181b" font-size="34" font-weight="700">What the hooks read and write</text>
<rect x="30" y="76" width="740" height="106" fill="#f4f4f5" stroke="#009296" rx="12"/>
<rect x="44" y="90" width="5" height="78" fill="#009296" stroke="none" rx="2"/>
<text x="64" y="128" fill="#18181b" font-size="30" font-weight="700">Repo memory bank</text>
<text x="64" y="164" fill="#52525b" font-size="28" font-weight="400">Outside the session</text>
<path d="M400 182v26" fill="none" stroke="#52525b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="212" width="740" height="142" fill="#f4f4f5" stroke="#0074d9" rx="12"/>
<rect x="44" y="226" width="5" height="114" fill="#0074d9" stroke="none" rx="2"/>
<text x="64" y="264" fill="#18181b" font-size="30" font-weight="700">SessionStart</text>
<text x="64" y="300" fill="#52525b" font-size="28" font-weight="400">Adds the Hindsight block at start and after</text>
<text x="64" y="336" fill="#52525b" font-size="28" font-weight="400">compaction.</text>
<path d="M400 354v26" fill="none" stroke="#52525b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="384" width="740" height="920" fill="none" stroke="#52525b" rx="12"/>
<text x="50" y="430" fill="#18181b" font-size="30" font-weight="700">UserPromptSubmit, first prompt</text>
<text x="50" y="468" fill="#52525b" font-size="28" font-weight="400">Default: autoInject reflect</text>
<rect x="50" y="494" width="700" height="106" fill="#f4f4f5" stroke="#0074d9" rx="12"/>
<rect x="64" y="508" width="5" height="78" fill="#0074d9" stroke="none" rx="2"/>
<text x="84" y="546" fill="#18181b" font-size="30" font-weight="700">Any other bank</text>
<text x="84" y="582" fill="#52525b" font-size="28" font-weight="400">Run low-budget reflect.</text>
<rect x="50" y="618" width="700" height="106" fill="#f4f4f5" stroke="#009296" rx="12"/>
<rect x="64" y="632" width="5" height="78" fill="#009296" stroke="none" rx="2"/>
<text x="84" y="670" fill="#18181b" font-size="30" font-weight="700">Bank the server confirms is empty</text>
<text x="84" y="706" fill="#52525b" font-size="28" font-weight="400">Can wait for prompt 2 to reflect.</text>
<path d="M400 724v26" fill="none" stroke="#52525b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="50" y="754" width="700" height="322" fill="#f4f4f5" stroke="#0074d9" rx="12"/>
<rect x="64" y="768" width="5" height="294" fill="#0074d9" stroke="none" rx="2"/>
<text x="84" y="806" fill="#18181b" font-size="30" font-weight="700">Reflect outcome</text>
<text x="84" y="842" fill="#52525b" font-size="28" font-weight="400">Answer: add it once.</text>
<text x="84" y="878" fill="#52525b" font-size="28" font-weight="400">Empty answer: end.</text>
<text x="84" y="914" fill="#52525b" font-size="28" font-weight="400">Timeout or server error: search pages, then</text>
<text x="84" y="950" fill="#52525b" font-size="28" font-weight="400">recall if no page matches.</text>
<text x="84" y="986" fill="#52525b" font-size="28" font-weight="400">Network error, 408 or 429: retry on the next</text>
<text x="84" y="1022" fill="#52525b" font-size="28" font-weight="400">prompt if an attempt remains.</text>
<text x="84" y="1058" fill="#52525b" font-size="28" font-weight="400">Other 4xx error: end.</text>
<path d="M400 1076v26" fill="none" stroke="#52525b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="50" y="1106" width="700" height="178" fill="#f4f4f5" stroke="#009296" rx="12"/>
<rect x="64" y="1120" width="5" height="150" fill="#009296" stroke="none" rx="2"/>
<text x="84" y="1158" fill="#18181b" font-size="30" font-weight="700">Fallback outcome</text>
<text x="84" y="1194" fill="#52525b" font-size="28" font-weight="400">Result: add it once.</text>
<text x="84" y="1230" fill="#52525b" font-size="28" font-weight="400">No result: retry reflect once on the next</text>
<text x="84" y="1266" fill="#52525b" font-size="28" font-weight="400">prompt if an attempt remains.</text>
<path d="M400 1304v26" fill="none" stroke="#52525b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="1334" width="740" height="142" fill="#f4f4f5" stroke="#0074d9" rx="12"/>
<rect x="44" y="1348" width="5" height="114" fill="#0074d9" stroke="none" rx="2"/>
<text x="64" y="1386" fill="#18181b" font-size="30" font-weight="700">UserPromptSubmit, every prompt</text>
<text x="64" y="1422" fill="#52525b" font-size="28" font-weight="400">By default, adds the full tool guide, and can add</text>
<text x="64" y="1458" fill="#52525b" font-size="28" font-weight="400">the page count.</text>
<path d="M400 1476v26" fill="none" stroke="#52525b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="1506" width="740" height="142" fill="#f4f4f5" stroke="#009296" rx="12"/>
<rect x="44" y="1520" width="5" height="114" fill="#009296" stroke="none" rx="2"/>
<text x="64" y="1558" fill="#18181b" font-size="30" font-weight="700">Stop</text>
<text x="64" y="1594" fill="#52525b" font-size="28" font-weight="400">By default, writes session turns.</text>
<text x="64" y="1630" fill="#52525b" font-size="28" font-weight="400">Drops compaction summaries.</text>
<path d="M400 1648v26" fill="none" stroke="#52525b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="1678" width="740" height="106" fill="#f4f4f5" stroke="#009296" rx="12"/>
<rect x="44" y="1692" width="5" height="78" fill="#009296" stroke="none" rx="2"/>
<text x="64" y="1730" fill="#18181b" font-size="30" font-weight="700">Repo memory bank</text>
<text x="64" y="1766" fill="#52525b" font-size="28" font-weight="400">Receives the turns</text>
</svg>
