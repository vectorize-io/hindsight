[project]
name = "hindsight-google-adk"
version = "0.1.1"
description = "Google ADK integration for Hindsight - persistent long-term memory for ADK agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vectorize", email = "support@vectorize.io" }
]
keywords = [
    "ai",
    "memory",
    "google-adk",
    "adk",
    "agents",
    "hindsight",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "google-adk>=2.0",
    "hindsight-client>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/vectorize-io/hindsight"
Documentation = "https://github.com/vectorize-io/hindsight/tree/main/hindsight-integrations/google-adk"
Repository = "https://github.com/vectorize-io/hindsight"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hindsight_google_adk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.uv]
# google-adk caps opentelemetry-api/-sdk below 1.45.1, the release that fixes
# GHSA-xcq7-p3pf-p88h (unbounded tracestate parsing). The cap is still present
# at the latest google-adk release (2.13.0 declares <=1.44), so override it.
override-dependencies = [
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
]
