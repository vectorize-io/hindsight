[project]
name = "hindsight-pipecat"
version = "0.1.2"
description = "Pipecat integration for Hindsight - persistent memory for voice AI pipelines"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Vectorize", email = "support@vectorize.io" }
]
keywords = [
    "ai",
    "memory",
    "pipecat",
    "voice",
    "agents",
    "hindsight",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pipecat-ai>=1.4.0,<2.0",  # 1.x universal LLMContext; 1.4.0 clears the file-read CVE advisories
    "hindsight-client>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/vectorize-io/hindsight"
Documentation = "https://github.com/vectorize-io/hindsight/tree/main/hindsight-integrations/pipecat"
Repository = "https://github.com/vectorize-io/hindsight"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hindsight_pipecat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]

[tool.uv]
# pipecat-ai declares `Pillow<13` (through the latest release, 1.13.0), but
# Pillow 13.0.0 is the first release outside several open advisories. pipecat
# uses only a narrow slice of PIL -- Image.open, Image.frombytes, Image.Image,
# and the save/convert/resize/tobytes methods -- none of which is removed or
# changed incompatibly in 13.0.0, so the override is narrow. Revisit when
# pipecat-ai relaxes the cap itself.
override-dependencies = ["pillow>=13.0.0"]
